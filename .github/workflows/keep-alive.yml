name: Keep backend warm

# Render's free tier spins the service down after ~15 minutes of
# inactivity, causing a 30-50s cold start on the next real request. This
# pings the health endpoint often enough that it never goes idle.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/healthz/
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            https://praitunova-backend.onrender.com/api/healthz/)
          echo "Health check responded with HTTP $status"
          if [ "$status" -ge 400 ] || [ "$status" -eq 000 ]; then
            echo "::warning::Backend health check failed with status $status"
          fi
