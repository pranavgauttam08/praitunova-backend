databases:
  - name: praitunova-db
    databaseName: praitunova
    user: praitunova
    plan: free

services:
  - type: web
    name: praitunova-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_admin
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/healthz/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST_USER
        value: "pgkijai301@gmail.com"
      - key: ADMIN_NOTIFICATION_EMAIL
        value: "Enquiry@Praitunova.com"
      - key: SITE_URL
        value: "https://praitunova-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://praitunovainfotech.com,https://www.praitunovainfotech.com,https://frontend-seven-lemon-46.vercel.app,http://localhost:3000,http://localhost:3001"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: praitunova-db
          property: connectionString
